services:
  - type: web
    name: studymate
    env: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn studymate.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: studymate-db
          property: connectionString

databases:
  - name: studymate-db
    databaseName: studymate
    user: studymate
    plan: free
